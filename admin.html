
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin NESACIS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }
    .login {
      width: min(360px, 92vw);
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #0001;
    }
    h2 { margin-top: 0; }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 15px;
    }
    input { border: 1px solid #ccd3df; }
    button {
      border: 0;
      color: white;
      background: #2563eb;
      cursor: pointer;
    }
    #error { color: #dc2626; }
  </style>
</head>
<body>
  <form class="login" onsubmit="login(event)">
    <h2>Admin NESACIS</h2>
    <input id="username" placeholder="Username" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password"
      autocomplete="current-password" required>
    <button type="submit">Login</button>
    <p id="error"></p>
  </form>

  <script>
    function login(event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === "admin" && password === "admin123") {
        sessionStorage.setItem("nesacis_admin", "true");
        window.location.href = "admin.html";
      } else {
        document.getElementById("error").textContent =
          "Username atau password salah.";
      }
    }
  </script>
</body>
</html>
